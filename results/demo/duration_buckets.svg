<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img"><rect width="780" height="330" fill="white"/><g font-family="Arial,sans-serif" fill="#18354b"><text x="30" y="28" font-size="18">Duration distributions</text><text x="30" y="51" font-size="12">Red: within flop group (%) | Teal: within viral group (%)</text><rect x="90" y="70.0" width="28" height="190.0" fill="#b91c1c"/><text x="104" y="60.0" text-anchor="middle" font-size="11">53.8%</text><rect x="122" y="211.3" width="28" height="48.7" fill="#0f766e"/><text x="136" y="201.3" text-anchor="middle" font-size="11">13.8%</text><text x="120" y="285" text-anchor="middle" font-size="12">0–3 min (incl.)</text><rect x="190" y="260.0" width="28" height="0.0" fill="#b91c1c"/><text x="204" y="250.0" text-anchor="middle" font-size="11">0.0%</text><rect x="222" y="246.2" width="28" height="13.8" fill="#0f766e"/><text x="236" y="236.2" text-anchor="middle" font-size="11">3.9%</text><text x="220" y="285" text-anchor="middle" font-size="12">3–5 min</text><rect x="290" y="219.4" width="28" height="40.6" fill="#b91c1c"/><text x="304" y="209.4" text-anchor="middle" font-size="11">11.5%</text><rect x="322" y="201.4" width="28" height="58.6" fill="#0f766e"/><text x="336" y="191.4" text-anchor="middle" font-size="11">16.6%</text><text x="320" y="285" text-anchor="middle" font-size="12">5–10 min</text><rect x="390" y="158.3" width="28" height="101.7" fill="#b91c1c"/><text x="404" y="148.3" text-anchor="middle" font-size="11">28.8%</text><rect x="422" y="129.3" width="28" height="130.7" fill="#0f766e"/><text x="436" y="119.3" text-anchor="middle" font-size="11">37.0%</text><text x="420" y="285" text-anchor="middle" font-size="12">10–20 min</text><rect x="490" y="246.6" width="28" height="13.4" fill="#b91c1c"/><text x="504" y="236.6" text-anchor="middle" font-size="11">3.8%</text><rect x="522" y="191.8" width="28" height="68.2" fill="#0f766e"/><text x="536" y="181.8" text-anchor="middle" font-size="11">19.3%</text><text x="520" y="285" text-anchor="middle" font-size="12">20–30 min</text><rect x="590" y="253.3" width="28" height="6.7" fill="#b91c1c"/><text x="604" y="243.3" text-anchor="middle" font-size="11">1.9%</text><rect x="622" y="226.8" width="28" height="33.2" fill="#0f766e"/><text x="636" y="216.8" text-anchor="middle" font-size="11">9.4%</text><text x="620" y="285" text-anchor="middle" font-size="12">&gt;30 min</text><text x="30" y="320" font-size="11">Pooled descriptive distributions; not the probability of success and not causal evidence.</text></g></svg>